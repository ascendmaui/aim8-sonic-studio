<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIM-8 Sonic Studio — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { max-width: 400px; padding: 2rem; }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; color: #22d3ee; margin-bottom: 0.5rem; }
        p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
        button {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white; border: none; padding: 0.75rem 2rem;
            border-radius: 12px; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎵</div>
        <h1>You're Offline</h1>
        <p>AIM·8 Sonic Studio needs an internet connection to generate music and access your library. Please check your connection and try again.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
